<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paperless Upload</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <a id="paperless-link" class="brand">
        <img src="assets/paperless.svg" width="32" height="32" alt="" />
        <span class="brand-name">Paperless Upload</span>
      </a>
      <button
        id="settings-toggle"
        class="icon-button"
        data-i18n-aria-label="uiSettings"
        aria-expanded="false"
        aria-controls="settings-panel"
        data-i18n-title="uiSettings"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path
            d="m10 3-.5 2-1.7 1-2-.6-2 3.4L5.3 10v2l-1.5 1.2 2 3.4 2-.6 1.7 1 .5 2h4l.5-2 1.7-1 2 .6 2-3.4-1.5-1.2v-2l1.5-1.2-2-3.4-2 .6-1.7-1-.5-2Z"
            transform="translate(0 1)"
          />
        </svg>
      </button>
    </header>
    <main>
      <section id="settings-panel" aria-labelledby="settings-title" hidden>
        <div class="section-heading">
          <h1 id="settings-title" data-i18n="uiConnectToPaperless"></h1>
          <p id="setup-hint" data-i18n="uiSetupHint"></p>
        </div>
        <section
          id="display-settings"
          class="display-settings"
          aria-labelledby="display-title"
          hidden
        >
          <h2 id="display-title" data-i18n="uiDisplayTitle"></h2>
          <label for="success-display" data-i18n="uiHideSuccess"></label>
          <select id="success-display" aria-describedby="display-help">
            <option value="8"></option>
            <option value="15"></option>
            <option value="30"></option>
            <option value="0" data-i18n="uiNeverHide"></option>
          </select>
          <p
            id="display-help"
            class="field-note"
            data-i18n="uiSavedImmediately"
          ></p>
          <p id="display-status" class="form-status error" role="status"></p>
        </section>
        <form id="settings-form">
          <h2 id="connection-title" hidden data-i18n="uiConnection"></h2>
          <label for="server-url" data-i18n="uiServerAddress"></label>
          <input
            id="server-url"
            type="text"
            inputmode="url"
            placeholder="https://paperless.example.com"
            required
            autocomplete="url"
            spellcheck="false"
          />
          <p class="field-note" data-i18n="uiServerHelp"></p>
          <label for="api-token" data-i18n="uiApiToken"></label>
          <input
            id="api-token"
            type="password"
            data-i18n-placeholder="uiYourToken"
            aria-describedby="token-help"
            autocomplete="off"
            spellcheck="false"
          />
          <p id="token-help" class="field-note" data-i18n="uiFindToken"></p>
          <p
            id="http-warning"
            class="notice"
            hidden
            data-i18n="uiHttpWarning"
          ></p>
          <p
            id="connection-access-note"
            class="field-note"
            data-i18n="uiConnectionAccess"
          ></p>
          <button
            id="save-settings"
            class="primary"
            type="submit"
            data-i18n="uiConnect"
          ></button>
          <p id="settings-status" class="form-status" role="status"></p>
        </form>
        <p class="privacy-note">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="10" width="14" height="11" rx="2" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3" />
          </svg>
          <span data-i18n="uiLocalToken"></span>
        </p>
      </section>
      <section id="upload-panel" data-i18n-aria-label="uiUploadPdfs" hidden>
        <button
          id="send-current"
          class="primary current-button"
          type="button"
          aria-describedby="current-status"
          disabled
          hidden
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 16V4m-5 5 5-5 5 5M5 16v4h14v-4" />
          </svg>
          <span id="send-current-label" data-i18n="uiUploadCurrent"></span>
        </button>
        <p id="current-status" class="field-note" role="status" hidden></p>
        <div class="secondary-actions">
          <button id="drop-zone" class="secondary-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"
              />
            </svg>
            <span data-i18n="uiChooseFiles"></span>
          </button>
          <button
            id="send-window"
            class="secondary-button"
            type="button"
            data-i18n-aria-label="uiUploadAllTabs"
            data-i18n-title="uiUploadWindow"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="7" width="14" height="14" rx="2" />
              <path d="M7 3h12a2 2 0 0 1 2 2v12" />
            </svg>
            <span data-i18n="uiAllTabs"></span>
          </button>
        </div>
        <p
          id="drop-hint"
          class="field-note drop-hint"
          data-i18n="uiDropHint"
        ></p>
        <input
          id="file-input"
          type="file"
          accept="application/pdf,.pdf"
          multiple
          hidden
        />
        <p
          id="web-access-note"
          class="field-note"
          hidden
          data-i18n="uiWebAccess"
        ></p>
        <button
          id="file-access"
          class="text-button"
          hidden
          data-i18n="uiAllowLocal"
        ></button>
        <div
          id="upload-status"
          class="upload-status"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        ></div>
        <h2
          id="batch-summary"
          class="batch-summary"
          hidden
          data-i18n="uiTransfers"
        ></h2>
        <ul id="job-list" class="job-list" aria-labelledby="batch-summary"></ul>
        <button
          id="dismiss-results"
          class="text-button"
          type="button"
          hidden
          data-i18n="uiDismiss"
        ></button>
      </section>
      <div class="original-actions">
        <button
          id="open-original"
          class="text-button"
          type="button"
          data-i18n="uiOpenPdfTab"
          hidden
        ></button>
        <button
          id="save-original"
          class="text-button"
          type="button"
          data-i18n="uiSaveOriginalPdf"
          hidden
        ></button>
      </div>
      <p id="original-status" class="form-status error" role="status"></p>
      <p id="fatal-error" class="form-status error" role="alert" hidden></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
